<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ŞansLab — Deneme Sürümü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gradTop:#161334; --gradBot:#0A0918; --bg:#0A0918;
  --card:rgba(255,255,255,.05); --cardSolid:#1C1947; --border:rgba(255,255,255,.10);
  --text:#F4F2FF; --sub:#A9A3D6; --gold:#FFD876; --goldFill:#F4C04A; --goldDeep:#E0A02E; --onGold:#241A05;
  --ballFace:#0E0C24; --ballHi:rgba(255,255,255,.22); --glowOn:1; --hair:rgba(255,255,255,.09);
  --disp:'Sora',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
html[data-theme="light"]{
  --gradTop:#FBF8F0; --gradBot:#F2ECDC; --bg:#FBF8F0;
  --card:#FFFFFF; --cardSolid:#FFFFFF; --border:#ECE4D2;
  --text:#1A1633; --sub:#6A6388; --gold:#B7841F; --goldFill:#F4C04A; --onGold:#241A05;
  --ballFace:#FFFFFF; --ballHi:rgba(255,255,255,.9); --glowOn:.35; --hair:#ECE4D2;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--body); color:var(--text); background:var(--bg); overflow-x:hidden}
/* backdrop */
#backdrop{position:fixed; inset:0; z-index:-1; background:linear-gradient(160deg,var(--gradTop),var(--gradBot))}
#glow{position:fixed; left:50%; top:-8%; width:120vw; height:70vh; transform:translateX(-50%); z-index:-1;
  background:radial-gradient(closest-side, rgba(244,192,74,.20), rgba(244,192,74,.03) 55%, transparent 72%); pointer-events:none}
#stars{position:fixed; inset:0; z-index:-1; pointer-events:none}
.app{max-width:560px; margin:0 auto; padding:22px 20px 60px; min-height:100%}
/* top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px}
.brand{font-family:var(--disp); font-weight:800; font-size:26px; letter-spacing:-.5px}
.brand b{color:var(--gold)}
.tb-actions{display:flex; gap:8px}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--border);background:var(--card);
  color:var(--text);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:scale(.95)}
/* hero */
.hero-t{font-family:var(--disp); font-weight:800; font-size:33px; line-height:1.12; letter-spacing:-1px; margin:2px 0 8px}
.hero-s{color:var(--sub); font-size:15px; max-width:320px; line-height:1.4}
.hero-balls{display:flex; gap:10px; margin:20px 0 6px}
/* premium strip */
.promo{display:flex; align-items:center; gap:13px; margin:20px 0 24px; padding:15px; border-radius:20px;
  border:1px solid rgba(244,192,74,.4); background:rgba(244,192,74,.12); cursor:pointer}
html[data-theme="light"] .promo{background:#FFF7E4;border-color:#F0D89A}
.promo .crown{width:38px;height:38px;border-radius:12px;background:var(--goldFill);display:flex;align-items:center;justify-content:center;color:var(--onGold);flex:0 0 auto}
.promo b{font-family:var(--disp);font-size:16px;font-weight:700}
.promo small{color:var(--sub);font-size:12.5px;display:block;margin-top:2px}
.section-t{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--sub);margin:6px 0 14px}
/* game cards */
.gcard{display:flex;align-items:center;gap:15px;padding:14px;border-radius:22px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;margin-bottom:13px;transition:transform .12s}
.gcard:active{transform:scale(.985)}
.orb{width:46px;height:46px;border-radius:50%;position:relative;flex:0 0 auto}
.orb::after{content:"";position:absolute;left:11px;top:9px;width:14px;height:9px;border-radius:50%;background:rgba(255,255,255,.5)}
.gcard .body{flex:1;min-width:0}
.gcard .title{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:-.2px}
.gcard .rule{color:var(--sub);font-size:12.5px;margin-top:3px}
.chev{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:0 0 auto}
.note{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--border);background:var(--card);border-radius:16px;padding:13px;margin-top:8px;color:var(--sub);font-size:11.5px;line-height:1.5}
/* game screen */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--gold);background:none;border:none;font-family:var(--body);font-weight:600;font-size:15px;cursor:pointer;margin-bottom:14px;padding:0}
.ghead{display:flex;align-items:center;gap:14px;border:1px solid var(--border);background:var(--card);border-radius:20px;padding:15px;margin-bottom:22px}
.ghead .bar{width:16px;height:46px;border-radius:8px;flex:0 0 auto}
.ghead h2{font-family:var(--disp);font-weight:800;font-size:22px;margin:0;letter-spacing:-.4px}
.ghead p{color:var(--sub);font-size:13px;margin:3px 0 0}
.label{font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text);opacity:.9;margin:22px 0 11px}
.seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px;gap:0}
.seg button{flex:1;border:none;background:none;color:var(--sub);font-family:var(--body);font-weight:700;font-size:12.5px;
  padding:11px 4px;border-radius:11px;cursor:pointer;position:relative}
.seg button.on{color:var(--segc,var(--gold))}
.seg button.on::before{content:"";position:absolute;inset:0;border-radius:11px;border:1px solid var(--segc,var(--gold));
  background:rgba(255,255,255,.10)}
html[data-theme="light"] .seg button.on::before{background:#fff}
.seg button span{position:relative}
.desc{color:var(--sub);font-size:12px;line-height:1.4;margin-top:10px;display:flex;align-items:center;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px}
.chip{width:44px;height:44px;border-radius:13px;border:1.5px solid var(--border);background:var(--card);
  color:var(--text);font-family:var(--disp);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chip.on{color:#fff}
.results{margin-top:24px;min-height:60px}
.empty{border:1.5px dashed var(--border);border-radius:22px;padding:44px 20px;text-align:center;color:var(--sub)}
.empty .dot{width:30px;height:30px;border-radius:50%;opacity:.5;margin:0 auto 14px}
.coupon{border:1px solid var(--border);background:var(--card);border-radius:22px;padding:16px;margin-bottom:13px}
.coupon .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.coupon .idx{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12.5px;font-weight:700;letter-spacing:.3px}
.coupon .idx i{width:8px;height:8px;border-radius:50%;display:inline-block}
.copybtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center}
.poollabel{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;color:var(--sub)}
.divider{height:1px;background:var(--hair);margin:12px 0}
.balls{display:flex;flex-wrap:wrap;gap:9px}
.independence{font-size:11px;color:var(--sub);line-height:1.4;margin-top:14px;text-align:center}
/* ball */
.ball{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;letter-spacing:.5px;flex:0 0 auto}
.ball .g{position:absolute;inset:-24% ;border-radius:50%;z-index:-1;filter:blur(3px)}
/* footer */
.footer{position:sticky;bottom:0;padding-top:20px;margin-top:14px;
  background:linear-gradient(to top, var(--bg) 62%, transparent)}
.btn-gold,.btn-game{width:100%;height:56px;border:none;border-radius:18px;font-family:var(--body);font-weight:800;font-size:17px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.btn-gold{background:linear-gradient(135deg,#FFD876,#F4C04A,#E0A02E);color:var(--onGold);
  box-shadow:0 8px 26px rgba(244,192,74,.45)}
.btn-game{color:#fff}
.btn-gold:active,.btn-game:active{transform:translateY(1px)}
.adbar{height:44px;border-radius:12px;border:1px dashed var(--border);color:var(--sub);font-size:11px;
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;letter-spacing:.5px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,4,15,.7);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal .box{background:var(--cardSolid);border:1px solid var(--border);border-radius:26px;padding:26px;max-width:400px;width:100%}
.modal .ic{width:56px;height:56px;border-radius:18px;background:var(--goldFill);color:var(--onGold);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px}
.modal h3{font-family:var(--disp);font-weight:800;font-size:21px;text-align:center;margin:0 0 12px}
.modal p{color:var(--sub);font-size:14px;line-height:1.55;text-align:center;margin:0 0 22px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;
  padding:11px 20px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:.92;transform:translateX(-50%) translateY(0)}
.demo-tag{position:fixed;top:10px;right:10px;z-index:40;background:rgba(244,192,74,.15);border:1px solid rgba(244,192,74,.4);
  color:var(--gold);font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.5px}

.statspill{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--body);font-weight:700;font-size:12px;padding:8px 11px;border-radius:999px;cursor:pointer;flex:0 0 auto}
.sheet{position:fixed;inset:0;background:rgba(5,4,15,.72);display:flex;align-items:flex-end;justify-content:center;z-index:55}
.sheet .panel{background:var(--cardSolid);border:1px solid var(--border);border-top-left-radius:26px;border-top-right-radius:26px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px 20px 30px}
.sheet h3{font-family:var(--disp);font-weight:800;font-size:19px;margin:0}
.st-sub{color:var(--sub);font-size:12.5px;margin:3px 0 16px}
.st-disc{display:flex;gap:9px;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px;color:var(--sub);font-size:12px;line-height:1.5;margin-bottom:18px}
.st-chart{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:12px;overflow-x:auto}
.st-legend{display:flex;gap:16px;margin:10px 0 4px;color:var(--sub);font-size:11.5px;flex-wrap:wrap}
.st-legend span{display:inline-flex;align-items:center;gap:5px}
.st-verdict{display:flex;gap:12px;border:1.5px solid var(--goldFill);background:var(--card);border-radius:18px;padding:15px;margin-top:18px}
.st-verdict .ic{width:36px;height:36px;border-radius:11px;background:var(--goldFill);color:var(--onGold);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:800}
.st-verdict b{font-family:var(--disp);font-size:15px}
.st-verdict p{color:var(--sub);font-size:12.5px;line-height:1.5;margin:4px 0 0}
.st-actions{display:flex;gap:10px;margin-top:16px}
.st-actions button{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--body);font-weight:700;padding:12px;border-radius:12px;cursor:pointer;font-size:13.5px}
.st-actions .close{background:linear-gradient(135deg,#FFD876,#F4C04A);color:var(--onGold);border:none}
.st-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--sub);margin:16px 0 10px}
</style>
</head>

/* ---------------- generator (faithful port) ---------------- */
function secureRandomInt(min,max){
  const range=max-min+1;
  if(window.crypto&&crypto.getRandomValues){
    const maxU=0xffffffff, limit=maxU-(maxU%range), buf=new Uint32Array(1);
    let x; do{ crypto.getRandomValues(buf); x=buf[0]; }while(x>=limit);
    return min+(x%range);
  }
  return min+Math.floor(Math.random()*range);
}
function pickUnique(min,max,count){
  const pool=[]; for(let i=min;i<=max;i++)pool.push(i);
  const out=[];
  for(let i=0;i<count;i++){ const k=secureRandomInt(i,pool.length-1); [pool[i],pool[k]]=[pool[k],pool[i]]; out.push(pool[i]); }
  return out.sort((a,b)=>a-b);
}
function weightedPickUnique(min,max,count){
  // demo weighting: mild bias, still unique — appearance only
  const pool=[]; for(let i=min;i<=max;i++)pool.push({n:i,w:1+secureRandomInt(0,3)});
  const out=[];
  for(let c=0;c<count;c++){
    let tot=pool.reduce((s,p)=>s+p.w,0), r=secureRandomInt(0,tot-1), idx=0;
    for(let i=0;i<pool.length;i++){ if(r<pool[i].w){idx=i;break;} r-=pool[i].w; }
    out.push(pool[idx].n); pool.splice(idx,1);
  }
  return out.sort((a,b)=>a-b);
}
/* popularity model (low-share) */
const LUCKY=new Set([1,3,7,9,11,13,17,21,23,33]);
function numberPopularity(n,max){let p=1;if(n<=31)p*=1.6;if(n<=12)p*=1.25;if(LUCKY.has(n))p*=1.4;if(n===7)p*=1.35;if(max>45&&n>45)p*=0.82;if(max>60&&n>60)p*=0.85;return p;}
function couponScore(nums,min,max){let s=nums.reduce((a,n)=>a+numberPopularity(n,max),0);const so=[...nums].sort((a,b)=>a-b);
  s+=nums.filter(n=>n<=31).length*0.45;
  let run=1,mx=1;for(let i=1;i<so.length;i++){if(so[i]===so[i-1]+1){run++;mx=Math.max(mx,run);}else run=1;}s+=(mx-1)*0.7;
  if(so.length>=3){const d=so[1]-so[0];let ar=d>0;for(let i=2;i<so.length;i++)if(so[i]-so[i-1]!==d){ar=false;break;}if(ar)s+=2;}
  const dec=new Set(so.map(n=>Math.floor((n-1)/10)));if(so.length>=4&&dec.size<=2)s+=0.8;
  const lc=nums.filter(n=>LUCKY.has(n)).length;if(lc>=3)s+=(lc-2)*0.5;return s;}
function selectLowShare(min,max,count,K=80){let best=null,bs=Infinity;for(let i=0;i<K;i++){const c=pickUnique(min,max,count);const sc=couponScore(c,min,max);if(sc<bs){bs=sc;best=c;}}return best??pickUnique(min,max,count);}
function isBalanced(nums){
  const odd=nums.filter(n=>n%2).length, even=nums.length-odd;
  if(Math.abs(odd-even)>2) return false;
  let run=1,mx=1; for(let i=1;i<nums.length;i++){ if(nums[i]===nums[i-1]+1){run++;mx=Math.max(mx,run);}else run=1; }
  return mx<=3;
}
function drawPool(pool,mode,countOverride){
  const count=countOverride??pool.count;
  if(mode==="lowshare") return selectLowShare(pool.min,pool.max,count);
  if(mode==="balanced"){ for(let a=0;a<40;a++){ const r=pickUnique(pool.min,pool.max,count); if(isBalanced(r))return r; } }
  return pickUnique(pool.min,pool.max,count);
}
function generateCoupon(game,{mode="random",variableCount}={}){
  const pools=game.pools.map(p=>({id:p.id,label:p.label,
    numbers:drawPool(p, mode, (game.variable&&p.id==="main")?variableCount:undefined)}));
  return {uid:Math.random().toString(36).slice(2), pools};
}
function couponToText(game,coupon){
  return coupon.pools.map(p=>p.label[lang]+": "+p.numbers.map(n=>String(n).padStart(2,"0")).join(" ")).join("  |  ");
}


/* ---------------- ŞansFormülü motoru (sans_formulu.py v2 portu) ---------------- */
const FW={F:0.15,R:0.10,G:0.10,P:0.10,S:0.15,B:0.10,A:0.30};
const FLUCKY=new Set([1,3,7,9,11,13,17,21,23,33]);
function patternPenalty(nums,nmax){
  const so=[...nums].sort((a,b)=>a-b),k=so.length;let s=0;
  if(nmax>40){const bd=nums.filter(n=>n<=31).length,al=Math.floor(k/2);if(bd>al)s+=(bd-al)*1.2;}
  let run=1,mx=1;for(let i=1;i<k;i++){run=so[i]===so[i-1]+1?run+1:1;mx=Math.max(mx,run);}
  if(mx>=2)s+=(mx-1)*0.8;
  if(k>=3){const d=so[1]-so[0];if(d>0&&so.every((v,i)=>i===0||v-so[i-1]===d))s+=2.5;}
  const dec=new Set(so.map(n=>Math.floor((n-1)/10)));
  if(k>=5&&dec.size<=2)s+=1.2;
  if(nmax>40&&so[k-1]-so[0]<(nmax-1)*0.45)s+=1.0;
  const lc=nums.filter(n=>FLUCKY.has(n)).length;if(lc>=3)s+=(lc-2)*0.6;
  if(nums.filter(n=>n%10===7).length>=3)s+=0.5;
  return s;
}
function fScore(nums,st,nmax){
  const k=nums.length,so=[...nums].sort((a,b)=>a-b);
  const avg=f=>nums.reduce((a,n)=>a+f(n),0)/k;
  const F=avg(n=>st.z[n]||0), R=avg(n=>st.rz[n]||0), G=avg(n=>st.gap[n]||1)-1;
  let ps=0,pc=0;for(let i=0;i<k;i++)for(let j=i+1;j<k;j++){ps+=st.lift[so[i]+"-"+so[j]]??1;pc++;}
  const P=ps/pc-1;
  const S=Math.exp(-Math.pow((nums.reduce((a,b)=>a+b,0)-st.mu)/st.sigma,2)/2);
  const odd=nums.filter(n=>n%2).length, low=nums.filter(n=>n<=st.mid).length;
  const B=(st.oddMode.includes(odd)?0.5:0)+(st.lowMode.includes(low)?0.5:0);
  const A=1-patternPenalty(nums,nmax)/3;
  return FW.F*F+FW.R*R+FW.G*G+FW.P*P+FW.S*S+FW.B*B+FW.A*A;
}
function guidedPick(min,max,count,st){
  const nums=[],w=[];
  for(let n=min;n<=max;n++){nums.push(n);
    w.push(Math.exp(0.9*(0.6*(st.z[n]||0)+0.4*(st.rz[n]||0))+0.5*((st.gap[n]||1)-1)));}
  const out=[];
  for(let c=0;c<count;c++){
    let tot=w.reduce((a,b)=>a+b,0),r=(secureRandomInt(0,1e9-1)/1e9)*tot,idx=0;
    for(let i=0;i<w.length;i++){if(r<w[i]){idx=i;break;}r-=w[i];}
    out.push(nums[idx]);nums.splice(idx,1);w.splice(idx,1);
  }
  return out.sort((a,b)=>a-b);
}
function formulaGenerate(gid,min,max,count,rows){
  const st=FSTATS[gid];if(!st)return null;
  const CAND=rows>1?6000:3500,seen=new Set(),scored=[];
  for(let i=0;i<CAND;i++){
    const c=i%10<7?guidedPick(min,max,count,st):pickUnique(min,max,count);
    const key=c.join(",");if(seen.has(key))continue;seen.add(key);
    scored.push([fScore(c,st,max),c]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  const maxOv=Math.max(1,count-4),picked=[];
  for(const [t,c] of scored){
    if(picked.every(p=>c.filter(n=>p.c.includes(n)).length<=maxOv))picked.push({t,c});
    if(picked.length===rows)break;
  }
  return picked;
}
function formulaExtra(gid){
  // Skor-ağırlıklı örnekleme (softmax, T=0.45): sıcaklar en sık, ama tekel yok.
  const st=FSTATS[gid];if(!st||!st.extraScore)return null;
  const es=Object.entries(st.extraScore);
  const w=es.map(([,v])=>Math.exp(v/0.45));
  let tot=w.reduce((a,b)=>a+b,0),r=(secureRandomInt(0,1e9-1)/1e9)*tot;
  for(let i=0;i<w.length;i++){if(r<w[i])return +es[i][0];r-=w[i];}
  return +es[es.length-1][0];
}

function generate(g){
  const opts={mode:state.mode,variableCount:state.count};
  if(state.mode==="formula"&&FSTATS[g.id]){
    const rows=state.rowMode==="ten"?10:1;
    const mainPool=g.pools[0];
    const picked=formulaGenerate(g.id,mainPool.min,mainPool.max,mainPool.count,rows);
    state.coupons=picked.map(p=>{
      const pools=[{id:mainPool.id,label:mainPool.label,numbers:p.c}];
      if(g.pools[1]){
        const ep=g.pools[1];
        const ev=formulaExtra(g.id)??pickUnique(ep.min,ep.max,1)[0];
        pools.push({id:ep.id,label:ep.label,numbers:[ev]});
      }
      return {uid:Math.random().toString(36).slice(2),pools,fscore:p.t};
    });
  } else {
    state.coupons = state.rowMode==="ten" ? Array.from({length:10},()=>generateCoupon(g,opts)) : [generateCoupon(g,opts)];
  }
  render();
  // attach copy handlers
  document.querySelectorAll(".copybtn").forEach(btn=>btn.onclick=()=>{
    const c=state.coupons.find(x=>x.uid===btn.dataset.uid);
    const txt=couponToText(g,c);
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(t("copied"))).catch(()=>{
      const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(t("copied"));}catch(e){}ta.remove();
    });
  });
}

function renderStats(g){
  const pool=g.pools[0], min=pool.min, max=pool.max, count=pool.count, N=1000, size=max-min+1;
  const counts={}; for(let n=min;n<=max;n++)counts[n]=0;
  for(let i=0;i<N;i++){ pickUnique(min,max,count).forEach(n=>counts[n]++); }
  const buckets=[]; for(let n=min;n<=max;n++)buckets.push({n,c:counts[n]});
  const maxC=Math.max(...buckets.map(b=>b.c),1);
  const expected=(N*count)/size;
  const sorted=[...buckets].sort((a,b)=>b.c-a.c);
  const hot=sorted.slice(0,5).map(b=>b.n), cold=sorted.slice(-5).map(b=>b.n).reverse();
  const hotSet=new Set(hot), coldSet=new Set(cold);
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  const gold=getVar("--gold"), sub=getVar("--sub");
  const bw=9,gap=3,ch=140,cw=buckets.length*(bw+gap), expY=ch-(expected/maxC)*ch;
  let bars=`<line x1="0" y1="${expY}" x2="${cw}" y2="${expY}" stroke="${gold}" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>`;
  buckets.forEach((b,i)=>{const h=Math.max(2,(b.c/maxC)*ch);const H=hotSet.has(b.n),C=coldSet.has(b.n);
    const fill=H?g.color:C?sub:(dark?"rgba(255,255,255,.25)":"rgba(0,0,0,.18)");
    bars+=`<rect x="${i*(bw+gap)}" y="${ch-h}" width="${bw}" height="${h}" rx="2" fill="${fill}"/>`;});
  const el=document.getElementById("statsSheet");
  el.innerHTML=`<div class="panel">
    <h3>${t("st_title")} · ${g.name[lang]}</h3>
    <div class="st-sub">${N.toLocaleString()} ${t("st_draws")} · ${t("st_sub")}</div>
    <div class="st-disc">ⓘ <span>${t("st_disc")}</span></div>
    <div class="st-chart"><svg width="${cw+6}" height="${ch+4}">${bars}</svg></div>
    <div class="st-legend">
      <span><i style="width:10px;height:10px;border-radius:50%;background:${g.color};display:inline-block"></i>${t("st_hot")}</span>
      <span><i style="width:10px;height:10px;border-radius:50%;background:${sub};display:inline-block"></i>${t("st_cold")}</span>
      <span><i style="width:14px;height:3px;background:${gold};display:inline-block"></i>${t("st_exp")}</span></div>
    <div class="st-label">${t("st_hot")}</div><div class="balls">${hot.map(n=>ballHTML(n,g.color,false,40)).join("")}</div>
    <div class="st-label">${t("st_cold")}</div><div class="balls">${cold.map(n=>ballHTML(n,g.color,false,40)).join("")}</div>
    <div class="st-verdict"><div class="ic">✓</div><div><b>${t("st_fairT")}</b><p>${t("st_fairB")}</p></div></div>
    <div class="st-actions"><button id="stResim">↻ ${t("st_resim")}</button><button class="close" id="stClose">${t("st_close")}</button></div>
    <div style="color:var(--sub);font-size:11px;text-align:center;margin-top:12px">${t("st_sample")}</div>
  </div>`;
  document.getElementById("stClose").onclick=()=>el.classList.add("hidden");
  document.getElementById("stResim").onclick=()=>renderStats(g);
  el.onclick=(e)=>{ if(e.target===el) el.classList.add("hidden"); };
}

/* ---------------- init ---------------- */
if(localStorage.getItem("sl_theme")) document.documentElement.setAttribute("data-theme",localStorage.getItem("sl_theme"));
document.documentElement.lang=lang;
applyI18nStatic();
render();
drawStars(); addEventListener("resize",drawStars);
// re-draw stars on theme toggle
const _tg=toggleTheme; toggleTheme=function(){_tg();drawStars();};
// first-run disclaimer
if(!localStorage.getItem("sl_disc")){ $("#disclaimer").classList.remove("hidden"); }
$("#discOk").onclick=()=>{localStorage.setItem("sl_disc","1");$("#disclaimer").classList.add("hidden");};
</script>
</body>
</html>
